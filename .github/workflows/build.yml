name: build
on: [ push ]
jobs:
    test:
        name: PHP ${{ matrix.php-version }} Test
        runs-on: ubuntu-latest
        strategy:
            matrix:
                php-version: ['8.1', '8.2', '8.3', '8.4']
        steps:
            -   name: Checkout code
                uses: actions/checkout@v2

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php-version }}
                    coverage: none

            -   name: Cache composer dependencies
                uses: actions/cache@v4
                with:
                    path: ./vendor
                    key: ${{ runner.os }}-php-${{ matrix.php-version }}-composer-${{ hashFiles('composer.json') }}
                    restore-keys: ${{ runner.os }}-php-${{ matrix.php-version }}-composer-${{ hashFiles('composer.json') }}

            -   name: Cache composer dependencies (box)
                uses: actions/cache@v4
                with:
                    path: ./vendor-bin/box/vendor
                    key: ${{ runner.os }}-php-${{ matrix.php-version }}-composer-${{ hashFiles('vendor-bin/box/composer.json') }}
                    restore-keys: ${{ runner.os }}-php-${{ matrix.php-version }}-composer-${{ hashFiles('vendor-bin/box/composer.json') }}

            -   name: Compile
                run: composer --no-interaction --optimize-autoloader install

            -   name: Build
                run: composer build

            -   name: Verify
                run: php ./dist/shed --version
